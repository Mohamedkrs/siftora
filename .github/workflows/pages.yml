# Publishes the project page (site/) to GitHub Pages as it is, so opening site/index.html
# locally shows exactly what gets published. site/brand holds copies of three files from
# resources/brand; update them there too when the logo changes.
# Needs Settings -> Pages -> Source: "GitHub Actions".

name: Website

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A per-attempt name, so "Re-run jobs" does not leave two "github-pages" uploads in one run.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
