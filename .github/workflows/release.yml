# Builds the Windows installer on a clean machine.
#
# Push a version tag (git tag v0.1.0 && git push --tags) to build it and attach Siftora-Setup.exe
# to a draft release with that name; review the draft, add notes, then publish it. The tag must
# match the version in package.json. Run it by hand from the Actions tab to only build: the
# installer is then a downloadable artifact of the run and nothing is released.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version in package.json."
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - name: Build the installer
        # No publishing from electron-builder itself; the release is created below. Unsigned until
        # a code signing certificate is set up.
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Keep the installer with the run
        uses: actions/upload-artifact@v4
        with:
          name: Siftora-Setup
          path: release/Siftora-Setup.exe
          if-no-files-found: error

      - name: Attach it to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/Siftora-Setup.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/Siftora-Setup.exe \
              --draft --title "Siftora ${GITHUB_REF_NAME#v}" --generate-notes
          fi
