# Keeps the app's engines up to date without shipping a new app version (Windows).
#
# Weekly (opt-in, see below) or on demand, it looks for a new whisper.cpp release. If there is
# one, it smoke-tests the upstream Windows build with the app's own flags
# (scripts/engines/smoke-whisper.mjs) and, only if that passes, publishes engines.json to the
# release "engines": the tested list the app reads (ENGINE_LIST_URL). A failing run publishes
# nothing; GitHub emails the failure.
#
# Not smoke-tested: the Windows CUDA build (GitHub runners have no GPU). It comes from the same
# upstream release as the Windows CPU build that is tested.

name: Engines

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'whisper.cpp release tag (empty = newest)'
        required: false
      force:
        description: 'Test and publish even if this version is already published'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: engines
  cancel-in-progress: false

env:
  UPSTREAM: ggml-org/whisper.cpp
  BASE_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
  BASE_MODEL_SHA256: 60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe
  VAD_MODEL_URL: https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v5.1.2.bin
  VAD_MODEL_SHA256: 29940d98d42b91fbd05ce489f3ecf7c72f0a42f027e4875919a28fb4c04ea2cf

jobs:
  check:
    # The weekly run is opt-in (repository variable ENGINES_WEEKLY = true), so it does not spend
    # Actions minutes until wanted. Manual runs always work.
    if: github.event_name != 'schedule' || vars.ENGINES_WEEKLY == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          version="${WANTED:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          # Only plain release tags, so the value is safe to use in names and URLs below.
          [[ "$version" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "unexpected tag: $version"; exit 1; }
          published=""
          if gh release download engines -R "$GITHUB_REPOSITORY" -p engines.json -O list.json 2>/dev/null; then
            published="$(jq -r '[.engines[] | select(.id == "whisper-win-cpu") | .version][0] // ""' list.json)"
          fi
          echo "newest: $version, published: ${published:-none}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" != "$published" ] || [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  test-windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      ASSET: '^whisper-bin-x64\.zip$'
    steps:
      - uses: actions/checkout@v4
      - name: Download the upstream build (checked against GitHub's SHA-256)
        run: |
          gh api "repos/$UPSTREAM/releases/tags/$VERSION" > release.json
          name="$(jq -r --arg re "$ASSET" '[.assets[] | select(.name | test($re))][0].name' release.json)"
          [ "$name" != "null" ] || { echo "no asset matching $ASSET"; exit 1; }
          digest="$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | .digest' release.json)"
          gh release download "$VERSION" -R "$UPSTREAM" -p "$name" -O build-archive
          echo "${digest#sha256:}  build-archive" | sha256sum -c -
          mkdir upstream && unzip -q build-archive -d upstream
          cli="$(find upstream -type f -name whisper-cli.exe | head -1)"
          [ -n "$cli" ] || { echo "whisper-cli.exe not found in $name"; exit 1; }
          echo "CLI=$cli" >> "$GITHUB_ENV"
          curl -fsSL -o jfk.wav "https://raw.githubusercontent.com/$UPSTREAM/$VERSION/samples/jfk.wav"
      - uses: ./.github/actions/smoke-models
      - name: Smoke test
        run: node scripts/engines/smoke-whisper.mjs "$CLI" models/ggml-base.bin models/ggml-silero.bin jfk.wav work

  publish:
    needs: [check, test-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish the engine list
        run: |
          gh release view engines >/dev/null 2>&1 || gh release create engines --latest=false --title "Engine list" \
            --notes "engines.json lists the tested engine builds the app downloads. Updated by the Engines workflow."
          gh release download engines -p engines.json -O previous.json 2>/dev/null || echo '{"schema":1,"engines":[]}' > previous.json
          gh api "repos/$UPSTREAM/releases/tags/$VERSION" > upstream.json
          node scripts/engines/make-list.mjs "$VERSION" upstream.json previous.json engines.json
          gh release upload engines engines.json --clobber
          cat engines.json
