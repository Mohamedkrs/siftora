name: Smoke test models
description: Whisper base + Silero VAD models for scripts/engines/smoke-whisper.mjs, cached and checksum-verified.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: models
        key: smoke-models-${{ env.BASE_MODEL_SHA256 }}-${{ env.VAD_MODEL_SHA256 }}
    - shell: bash
      run: |
        mkdir -p models
        fetch() { # url sha256 file
          [ -f "$3" ] || curl -fsSL -o "$3" "$1"
          node -e "const h=require('crypto').createHash('sha256').update(require('fs').readFileSync(process.argv[1])).digest('hex'); if (h !== process.argv[2]) { console.error('checksum mismatch: ' + process.argv[1]); process.exit(1) }" "$3" "$2"
        }
        fetch "$BASE_MODEL_URL" "$BASE_MODEL_SHA256" models/ggml-base.bin
        fetch "$VAD_MODEL_URL" "$VAD_MODEL_SHA256" models/ggml-silero.bin
