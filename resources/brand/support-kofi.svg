<svg xmlns="http://www.w3.org/2000/svg" width="226" height="60" viewBox="0 0 226 60" role="img" aria-label="Buy me a coffee on Ko-fi">
  <title>Buy me a coffee on Ko-fi</title>
  <!-- Orange outline keeps it visible on dark pages too. -->
  <rect x="0.75" y="0.75" width="224.5" height="58.5" rx="13.25" fill="#16131F" stroke="#FF7A1A" stroke-opacity="0.7" stroke-width="1.5"/>
  <g transform="translate(20 15)">
    <!-- steam -->
    <g fill="none" stroke="#F0437A" stroke-width="2" stroke-linecap="round">
      <path d="M8 4c-1.6-1.4 1.6-2.6 0-4"/>
      <path d="M14 4c-1.6-1.4 1.6-2.6 0-4"/>
    </g>
    <!-- cup and handle -->
    <path d="M2 8h20v9a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z" fill="#FF7A1A"/>
    <path d="M22 11h2a4 4 0 0 1 0 8h-2.6" fill="none" stroke="#FF7A1A" stroke-width="2.4" stroke-linecap="round"/>
    <!-- heart on the cup -->
    <path d="M12 21.5l-3.6-3.4a2.2 2.2 0 0 1 3.1-3.1l.5.5.5-.5a2.2 2.2 0 0 1 3.1 3.1z" fill="#16131F"/>
  </g>
  <text x="62" y="28" fill="#FFFFFF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700">Buy me a coffee</text>
  <text x="62" y="45" fill="#FFFFFF" fill-opacity="0.75" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12">Support Siftora on Ko-fi</text>
</svg>
