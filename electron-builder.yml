appId: app.siftora
productName: Siftora
directories:
  output: release
files:
  - out/**
# Caption fonts: used by the preview (bundled by Vite) and by the video renderer (libass),
# which reads them from <resources>/fonts.
extraResources:
  - from: resources/fonts
    to: fonts
    filter:
      - '*.ttf'
      - README.md
win:
  target: nsis
mac:
  target: dmg
linux:
  target: AppImage
extraMetadata:
  license: GPL-3.0-only
# electron-builder has no top-level license field; package.json and extraMetadata carry GPL-3.0-only
